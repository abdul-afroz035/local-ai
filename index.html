<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Local AI — Premium Uncensored Chat</title>
  <link rel="stylesheet" href="styles.css">
  
  <!-- Markdown & Code Highlighting -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" id="hljs-theme">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>
<body>

  <div id="app-container">
    <!-- Backdrop for mobile drawer -->
    <div id="sidebar-backdrop"></div>

    <!-- Left Sidebar -->
    <aside id="sidebar">
      <div class="sidebar-top">
        <div class="sidebar-header">
          <a href="#" class="brand" id="brand-link">
            <div class="brand-icon">✦</div>
            <span>Local AI</span>
          </a>
          <button id="btn-collapse-sidebar" class="icon-btn" title="Close sidebar (⌘B)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </button>
        </div>

        <button id="btn-new-chat" class="btn-new-chat">
          <div style="display:flex; align-items:center; gap:8px;">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            <span>New chat</span>
          </div>
          <span class="kbd-shortcut">⌘K</span>
        </button>

        <div class="search-wrapper">
          <span class="search-icon">🔍</span>
          <input type="text" id="search-input" placeholder="Search conversations...">
          <button id="search-clear" title="Clear search">✕</button>
        </div>
      </div>

      <!-- Time-Grouped Conversation History -->
      <div class="chat-history-scroll" id="chat-history-list">
        <!-- Injected dynamically: Today, Yesterday, Previous 7 Days, Older -->
      </div>

      <!-- User Profile & Sidebar Footer -->
      <div class="sidebar-footer">
        <div class="user-profile-row">
          <div class="user-info">
            <div class="user-avatar">AU</div>
            <div class="user-meta">
              <span class="user-name">Local User</span>
              <span class="user-plan">Apple Silicon Metal</span>
            </div>
          </div>
          <div class="status-badge" id="backend-status-pill">
            <span class="status-dot" id="status-indicator"></span>
            <span id="status-text">Online</span>
          </div>
        </div>

        <div class="footer-actions">
          <button id="btn-theme-toggle" class="icon-btn" title="Toggle Light / Dark mode">
            <span id="theme-icon">☀️</span>
          </button>
          <button id="btn-open-settings" class="icon-btn" title="Settings & Gateway">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
          </button>
        </div>
      </div>
    </aside>

    <!-- Main Chat View -->
    <main id="main-chat">
      <!-- Minimalist Topbar -->
      <header class="chat-topbar">
        <div class="topbar-left">
          <button id="btn-toggle-sidebar" class="icon-btn" title="Toggle sidebar">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
          </button>
          <div class="topbar-chat-title" id="current-chat-title" title="Click to rename">New Chat</div>
        </div>

        <div class="topbar-right">
          <div class="model-badge" id="btn-model-badge" title="Active Model">
            <span style="font-size:12px;">✦</span>
            <span id="current-model-display">Llama 3.1 8B Abliterated</span>
          </div>
          <button id="btn-topbar-new" class="icon-btn" title="Start new chat">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          </button>
        </div>
      </header>

      <!-- Scrollable Chat Messages Container -->
      <div id="messages-scroll">
        <div class="messages-container" id="messages-container">
          <!-- Dynamic Content: Welcome Screen or Message Turns -->
        </div>
      </div>

      <!-- Chat Composer Input Area -->
      <div class="composer-wrapper">
        <div class="composer-box">
          <textarea id="chat-input" placeholder="How can I help you today?" rows="1"></textarea>
          
          <div class="composer-controls">
            <div class="composer-left-actions">
              <input type="file" id="file-attachment-input" style="display:none;" accept=".txt,.py,.js,.html,.css,.json,.md,.csv">
              <button id="btn-attach" class="icon-btn" title="Attach text or code file">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
              </button>
              <span class="composer-hint" id="composer-hint">Shift + Return for new line</span>
            </div>

            <button id="btn-send" class="btn-send" title="Send message">
              <svg id="send-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
              <svg id="stop-icon" style="display:none;" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="2"></rect></svg>
            </button>
          </div>
        </div>
        <div class="composer-disclaimer">Local AI runs privately with zero moralizing refusal filters on Apple Silicon Metal GPU.</div>
      </div>

      <!-- Artifact Slideout Drawer -->
      <div id="artifact-drawer">
        <div class="drawer-header">
          <div style="display:flex; align-items:center; gap:8px;">
            <span style="color:var(--claude-coral); font-weight:700;">✦</span>
            <span style="font-weight: 600;" id="artifact-drawer-title">Artifact Preview</span>
          </div>
          <div class="drawer-actions">
            <button id="btn-artifact-copy" class="code-btn">Copy</button>
            <button id="btn-artifact-download" class="code-btn">Download</button>
            <button id="btn-close-artifact" class="icon-btn" title="Close drawer">✕</button>
          </div>
        </div>
        <pre class="drawer-content"><code id="artifact-drawer-code"></code></pre>
      </div>
    </main>
  </div>

  <!-- Settings & Gateway Modal -->
  <div id="settings-modal" class="modal-backdrop">
    <div class="modal-card">
      <div class="modal-header">
        <span>Settings & Backend Gateway</span>
        <button id="btn-close-settings" class="icon-btn">✕</button>
      </div>

      <div class="form-group">
        <label for="backend-url-input">API Gateway Base URL</label>
        <input type="text" id="backend-url-input" value="https://alien-metal-hawk-wishing.trycloudflare.com">
        <div class="quick-btn-row">
          <button type="button" class="btn-secondary" id="btn-preset-local">Local Port (11434)</button>
          <button type="button" class="btn-secondary" id="btn-preset-tunnel">Active Cloudflare Gateway</button>
        </div>
      </div>

      <div class="form-group">
        <label for="model-select">Active Model</label>
        <select id="model-select">
          <option value="llama3-abliterated:latest">Llama 3 8B Abliterated (Default)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="system-prompt-input">System Prompt</label>
        <textarea id="system-prompt-input" rows="3"></textarea>
        <div class="quick-btn-row">
          <button type="button" class="btn-secondary" id="btn-preset-unrestricted">Unrestricted Default</button>
          <button type="button" class="btn-secondary" id="btn-preset-coder">Expert Coder</button>
          <button type="button" class="btn-secondary" id="btn-preset-concise">Concise & Direct</button>
        </div>
      </div>

      <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 14px;">
        <button id="btn-cancel-settings" class="btn-secondary">Cancel</button>
        <button id="btn-save-settings" class="btn-primary">Save Settings</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
